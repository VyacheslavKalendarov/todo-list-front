@if (isEditing()) {
  <input #editInput [value]="editValue()" (input)="onInput($event)" />
  <ui-button
    title="Save"
    [appearance]="'primary'"
    [disabled]="editValue().trim().length === 0"
    (click)="saveEdit()"
  >
    Save
  </ui-button>
} @else {
  <span (dblclick)="startEdit()">{{ task().text }}</span>
}

<ui-button
  class="delete-button"
  [appearance]="'primary-destructive'"
  [title]="'Удалить задачу'"
  (click)="removeTaskRequest.emit(task().id)"
  >Удалить задачу
</ui-button>
