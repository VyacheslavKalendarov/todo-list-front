@if (isEditing()) {
  <input (input)="onInput($event)" [value]="editValue()" />
  <ui-button (click)="saveEdit()" [appearance]="'primary'" title="Save" />
} @else {
  <span (dblclick)="startEdit()">{{ task().text }}</span>
}

<ui-button
  (click)="removeTaskRequest.emit(task().id)"
  [appearance]="'primary-destructive'"
  [title]="'Delete'"
></ui-button>
