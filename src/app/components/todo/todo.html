<section class="card">
  <h1>{{ title }}</h1>
  <app-todo-list (removeTask)="removeTask($event)" [taskList]="taskList()" />
  <form>
    <input [formField]="taskForm.text" matInput placeholder="Enter task description" type="text" />
    <button
      (click)="addTask()"
      [disabled]="taskForm.text().invalid()"
      class="button button--add"
      type="button"
    >
      Add task
    </button>
  </form>
</section>
